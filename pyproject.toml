[project]
name = "compass-comet"
version = "0.1.0"
description = "Comet Object Measurement Pipeline with Automated Selection and Scoring"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.0.2",
    "opencv-python==4.12.0.88",
    "openpyxl==3.1.5",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "scikit-image==0.24.0",
    "segment-anything==1.0",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "ultralytics==8.3.226",
]

[project.scripts]
compass = "compass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compass"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
